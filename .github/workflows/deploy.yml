name: Build and Deploy VitePress Docs to gh-pages

on:
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check directory
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la
          echo "=== ls docs-site ==="
          ls -la docs-site/ 2>/dev/null || echo "docs-site not found"
          echo "=== cat docs-site/package.json ==="
          cat docs-site/package.json 2>/dev/null || echo "package.json not found"

      - name: Install dependencies
        run: |
          echo "=== npm install ==="
          cd docs-site && npm install --no-audit --no-fund --loglevel=verbose 2>&1 | tail -20
        shell: bash

      - name: Build
        run: cd docs-site && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-site/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
